<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style>
</head>
<body>
<div id="player"></div>
<div id="clickcatcher" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;"></div>
<script>
document.getElementById('clickcatcher').addEventListener('click', function () {
	if (player) {
		player.unMute();
		player.setVolume(100);
		player.playVideo();
	}
});
</script>
<script>
function getParam(name) {
	var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
	return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : null;
}

var videoId = getParam('id');

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

var player;
window.onYouTubeIframeAPIReady = function() {
	player = new YT.Player('player', {
		height: '100%',
		width: '100%',
		videoId: videoId,
		playerVars: { autoplay: 1, controls: 0, disablekb: 1, mute: 1 },
		events: {
			onReady: function(e) {
				e.target.playVideo();
				setTimeout(function () {
					e.target.unMute();
					e.target.setVolume(100);
				}, 500);
			}
		}
	});
};

function BBX_SetVolume(v) { if (player && player.setVolume) player.setVolume(v); }
function BBX_Play() { if (player && player.playVideo) player.playVideo(); }
function BBX_Pause() { if (player && player.pauseVideo) player.pauseVideo(); }
function BBX_Stop() { if (player && player.stopVideo) player.stopVideo(); }
</script>
</body>
</html>
